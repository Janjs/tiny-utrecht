# Serves site/ and proxies the weather so every visitor shares one Open-Meteo request per hour.
proxy_cache_path /var/cache/nginx/weather levels=1 keys_zone=weather:1m max_size=10m inactive=2h use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # map tiles never change in place; a new map gets new files
    location /map_files/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /api/weather {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $upstream api.open-meteo.com;
        proxy_pass https://$upstream/v1/forecast?latitude=52.0907&longitude=5.1214&current=temperature_2m,weather_code,wind_speed_10m&daily=sunrise,sunset&timezone=Europe%2FAmsterdam&forecast_days=1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.open-meteo.com;
        proxy_set_header Accept-Encoding "";
        proxy_cache weather;
        proxy_cache_key "utrecht";
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
