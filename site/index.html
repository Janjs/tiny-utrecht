<style>
  /* Layout: full-bleed zoomable map; weather card top-left, zoom buttons top-right, frame chips along the bottom.
     All controls use the Utrecht flag: red and white, one look in both themes. */
  :root {
    --bg: #e9ecef;
    --panel: #fbfcfd;
    --fg: #1d2630;
    --muted: #5b6876;
    --line: #cfd6dd;
    --accent: #2f6fb3;
    --brick: #b4573a;  /* frame outlines: Utrecht roof tile */
    --flag-red: #d21f26;
    --flag-red-dark: #9e1419;
    --flag-white: #ffffff;
    --display: "Pixelify Sans", "Courier New", monospace;
    --hud: "Silkscreen", "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --panel: #1b222a; --fg: #e6ebf0; --muted: #9aa7b4; --line: #2e3843;
      --accent: #6fa8e6; --brick: #e08a6b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --panel: #1b222a; --fg: #e6ebf0; --muted: #9aa7b4; --line: #2e3843;
    --accent: #6fa8e6; --brick: #e08a6b; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 15px; overflow: hidden; }
  #map { position: fixed; inset: 0; background: var(--bg); }

  .hud {
    position: fixed; z-index: 5;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: calc(100vw - 32px - 54px); /* leave room for the zoom buttons */
    background: var(--flag-white); color: var(--flag-red);
    border: 2px solid var(--flag-red); outline: 1px solid var(--flag-red-dark);
    padding: 6px 12px 8px 9px;
    display: grid; grid-template-columns: auto 1fr; column-gap: 9px; row-gap: 1px; align-items: center;
  }
  .hud h1 {
    grid-column: 1 / -1; margin: 0 0 4px; font: 700 10px var(--hud); letter-spacing: 0.12em;
    color: var(--flag-red); text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  /* the Utrecht flag: white above the diagonal, red below */
  .hud h1 .flag { width: 14px; height: 14px; flex: none; outline: 1px solid var(--flag-red); }
  .hud .icon { width: 28px; height: 28px; grid-row: span 2; image-rendering: pixelated; }
  .hud .time { font: 400 22px/1 var(--hud); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hud .sky { font: 400 10px var(--hud); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chips {
    position: fixed; left: 0; right: 0;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; z-index: 5; pointer-events: none;
  }
  .chip {
    pointer-events: auto; font: 700 12px var(--hud); letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 11px; border: 2px solid var(--flag-red); outline: 1px solid var(--flag-red-dark);
    background: var(--flag-white); color: var(--flag-red); cursor: pointer;
  }
  .chip:hover, .chip[aria-current="true"] { background: var(--flag-red); color: var(--flag-white); border-color: var(--flag-white); }
  .chip:focus-visible, .zoom button:focus-visible { outline: 3px solid var(--flag-red-dark); outline-offset: 2px; }
  .credit {
    position: fixed; z-index: 5; left: 0; right: 0; text-align: center;
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font: 400 10px system-ui, sans-serif; color: var(--fg); text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .credit a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit a:focus-visible { outline: 2px solid var(--flag-red-dark); outline-offset: 2px; }
  .zoom {
    position: fixed; z-index: 5; display: grid; gap: 6px;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
  }
  .zoom button {
    width: 38px; height: 38px; font: 700 18px var(--hud); padding: 0;
    border: 2px solid var(--flag-red); outline: 1px solid var(--flag-red-dark);
    background: var(--flag-white); color: var(--flag-red); cursor: pointer;
  }
  .zoom button:hover { background: var(--flag-red); color: var(--flag-white); border-color: var(--flag-white); }
  @media (max-width: 420px) {
    .hud .time { font-size: 20px; }
    .hud .icon { width: 24px; height: 24px; }
  }
</style>

' y='5' width='1' height='1' fill='#fff'/><rect x='1' y='5' width='1' height='1' fill='#d21f26'/><rect x='2' y='5' width='1' height='1' fill='#d21f26'/><rect x='3' y='5' width='1' height='1' fill='#d21f26'/><rect x='4' y='5' width='1' height='1' fill='#d21f26'/><rect x='5' y='5' width='1' height='1' fill='#d21f26'/><rect x='6' y='5' width='1' height='1' fill='#d21f26'/><rect x='0' y='6' width='1' height='1' fill='#d21f26'/><rect x='1' y='6' width='1' height='1' fill='#d21f26'/><rect x='2' y='6' width='1' height='1' fill='#d21f26'/><rect x='3' y='6' width='1' height='1' fill='#d21f26'/><rect x='4' y='6' width='1' height='1' fill='#d21f26'/><rect x='5' y='6' width='1' height='1' fill='#d21f26'/><rect x='6' y='6' width='1' height='1' fill='#d21f26'/></svg>Tiny Utrecht</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<script>
  // ---------- weather ----------
  // Built in at publish time; a fresher copy is read from the artifact's db when this view can.
  const WEATHER_AT_PUBLISH = {
    code: 3, temp: 15.7, wind: 22.7, time: "2026-10-27T13:00",
    sunrise: "2026-10-27T07:25", sunset: "2026-10-27T17:20",
  };
  let weather = WEATHER_AT_PUBLISH;

  // WMO weather codes, as Open-Meteo reports them
  function describe(code) {
    if (code === 0) return ["Clear", "clear"];
    if (code === 1) return ["Mostly clear", "clear"];
    if (code === 2) return ["Partly cloudy", "partly"];
    if (code === 3) return ["Overcast", "cloud"];
    if (code === 45 || code === 48) return ["Fog", "fog"];
    if (code >= 51 && code <= 57) return ["Drizzle", "rain"];
    if (code >= 61 && code <= 67) return ["Rain", "rain"];
    if (code >= 71 && code <= 77) return ["Snow", "snow"];
    if (code >= 80 && code <= 82) return ["Showers", "rain"];
    if (code === 85 || code === 86) return ["Snow showers", "snow"];
    if (code >= 95) return ["Thunderstorm", "storm"];
    return ["Cloudy", "cloud"];
  }

  // 14 × 14 pixel icons; each layer is a colour and rows of '#'
  const SUN = ["......##......", "..#...##...#..", "...#......#...", ".....####.....", "....######....", "##.########.##", "##.########.##", "....######....", ".....####.....", "...#......#...", "..#...##...#..", "......##......"];
  const MOON = [".....####.....", "...####.......", "..####........", ".####.........", ".###..........", ".###..........", ".###..........", ".####.........", "..#####....#..", "...#########..", ".....#####...."];
  const CLOUD = ["", "", "", "", ".......####...", "......######..", "....##########", "..############", ".#############", ".#############", "..###########."];
  const SMALL_CLOUD = ["", "", "", "", "", "", "........###...", ".......#####..", ".....########.", "....#########.", "....#########.", ".....#######.."];
  const HIGH_CLOUD = ["", ".......####...", "......######..", "....##########", "..############", ".#############", "..###########."];
  const RAIN = ["", "", "", "", "", "", "", "", "...#...#...#..", "..#...#...#...", "", ".#...#...#....", "#...#...#....."];
  const SNOW = ["", "", "", "", "", "", "", "", "..#....#....#.", "", "....#....#....", "", ".#....#....#.."];
  const BOLT = ["", "", "", "", "", "", "", "", "......###.....", ".....###......", "....#####.....", "......##......", ".....##.......", "....#........."];
  const FOG = ["", "", "", "##########....", "", "...###########", "", "###########...", "", "....##########", "", "#########....."];
  // red pixels on the white card; the pink second tone separates overlapping layers
  const C = { sun: "#d21f26", moon: "#d21f26", cloud: "#d21f26", dark: "#f09a96", drop: "#d21f26", bolt: "#d21f26" };

  function layers(kind, day) {
    const orb = day ? [C.sun, SUN] : [C.moon, MOON];
    return {
      clear: [orb],
      partly: [orb, [C.cloud, SMALL_CLOUD]],
      cloud: [[C.cloud, CLOUD]],
      fog: [[C.dark, FOG]],
      rain: [[C.dark, HIGH_CLOUD], [C.drop, RAIN]],
      snow: [[C.dark, HIGH_CLOUD], [C.cloud, SNOW]],
      storm: [[C.dark, HIGH_CLOUD], [C.bolt, BOLT]],
    }[kind];
  }

  function drawIcon(kind, day) {
    const svg = document.getElementById("sky-icon");
    let rects = "";
    for (const [colour, rows] of layers(kind, day)) {
      rows.forEach((row, y) => [...row].forEach((ch, x) => {
        if (ch === "#") rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colour}"/>`;
      }));
    }
    svg.innerHTML = rects;
  }

  const amsterdam = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Amsterdam", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const minutesOf = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

  function renderHud() {
    const now = amsterdam.format(new Date());
    document.getElementById("clock").textContent = now;
    // day or night from today's clock against the reported sunrise and sunset (they move a few minutes a day)
    const t = minutesOf(now);
    const day = t >= minutesOf(weather.sunrise.slice(11, 16)) && t < minutesOf(weather.sunset.slice(11, 16));
    const [label, kind] = describe(weather.code);
    document.getElementById("sky").textContent = `${label} · ${Math.round(weather.temp)}°C · ${day ? "Day" : "Night"}`;
    drawIcon(kind, day);
  }
  renderHud();
  setInterval(renderHud, 10_000);

  const isWeather = (w) => w && typeof w.code === "number" && typeof w.sunrise === "string" && typeof w.sunset === "string";

  // On claude.ai: the artifact's db, kept fresh by an hourly task.
  (async () => {
    const db = await window.claude?.use?.("db");
    if (!db) return;
    db.doc("weather/utrecht").onSnapshot(
      (snap) => {
        const w = snap.exists ? snap.data() : null;
        if (isWeather(w)) { weather = w; renderHud(); }
      },
      () => {}, // keep the built-in weather
    );
  })();

  // On our own server: /api/weather is Open-Meteo through nginx, cached for an hour for every visitor.
  async function fetchWeather() {
    try {
      const r = await fetch("api/weather");
      if (!r.ok) return;
      const d = await r.json();
      const w = {
        code: d.current.weather_code, temp: d.current.temperature_2m, wind: d.current.wind_speed_10m,
        time: d.current.time, sunrise: d.daily.sunrise[0], sunset: d.daily.sunset[0],
      };
      if (isWeather(w)) { weather = w; renderHud(); }
    } catch {
      // blocked (claude.ai) or offline: keep what we have
    }
  }
  if (!location.hostname.endsWith("claude.ai") && !location.hostname.endsWith("claudeusercontent.com")) {
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);
  }

  // ---------- map ----------
  const CANVAS_W = 10240, CANVAS_H = 6144, FRAME = 1024;
  // places to jump to: the top-left of a 1024 px square around each, in map pixels
  const FRAMES = [
    { id: "dom", label: "Dom", x: 4208, y: 2488 },
    { id: "oudegracht", label: "Oudegracht", x: 3968, y: 3588 },
    { id: "nieuwegracht", label: "Nieuwegracht", x: 4923, y: 3753 },
    { id: "station", label: "Centraal", x: 1488, y: 2448 },
    { id: "park", label: "Griftpark", x: 6438, y: 188 },
    { id: "residential", label: "Wittevrouwen", x: 6488, y: 1588 },
    { id: "lombok", label: "Lombok", x: 388, y: 1188 },
    { id: "oost", label: "Oost", x: 6688, y: 4688 },
    { id: "wilhelminapark", label: "Wilhelminapark", x: 8288, y: 4128 },
  ];
  const vp = (px) => px / CANVAS_W; // OpenSeadragon viewport units: canvas width = 1
  // tiny.london's viewer stops at 1.1 screen pixels per map pixel; both maps are 0.293 m per pixel,
  // so the same limit gives the same closest view. Touch devices can go closer — small screens need it.
  const maxScreenPxPerMapPx = () => (matchMedia("(pointer: coarse)").matches ? 2.2 : 1.1);

  const viewer = OpenSeadragon({
    element: document.getElementById("map"),
    // the drawn map as a Deep Zoom pyramid in map_files/ (made by scripts/make_dzi.py)
    tileSources: {
      Image: {
        xmlns: "http://schemas.microsoft.com/deepzoom/2008",
        Url: "map_files/", Format: "webp", Overlap: "0", TileSize: "1024",
        Size: { Width: String(CANVAS_W), Height: String(CANVAS_H) },
      },
    },
    showNavigationControl: false,
    imageSmoothingEnabled: false,
    maxZoomPixelRatio: 100, // the real limits are set by fitZoomLimits()
    homeFillsViewer: true,
    visibilityRatio: 1,
    constrainDuringPan: true,
    animationTime: 0.9,
    gestureSettingsMouse: { clickToZoom: false },
    crossOriginPolicy: false,
  });

  // Zoomed out, the map must always cover the window: no background showing at any edge.
  function fitZoomLimits() {
    const { x: w, y: h } = viewer.viewport.getContainerSize();
    viewer.viewport.minZoomLevel = Math.max(1, (h / w) / (CANVAS_H / CANVAS_W));
    viewer.viewport.maxZoomLevel = (maxScreenPxPerMapPx() * CANVAS_W) / w;
    viewer.viewport.applyConstraints(true);
  }
  // Open fully zoomed out on the whole map, and stay that way through resizes
  // (the viewer's frame often changes size while loading) until the person moves the map.
  let moved = false;
  function showWholeMap(immediate) {
    viewer.viewport.zoomTo(viewer.viewport.getMinZoom(), null, immediate);
    viewer.viewport.panTo(new OpenSeadragon.Point(0.5, CANVAS_H / CANVAS_W / 2), immediate);
  }
  for (const ev of ["canvas-drag", "canvas-scroll", "canvas-pinch", "canvas-key"]) viewer.addHandler(ev, () => { moved = true; });
  viewer.addHandler("resize", () => {
    // after OpenSeadragon's own resize handling, which keeps the old view
    setTimeout(() => {
      fitZoomLimits();
      if (!moved) showWholeMap(true);
    }, 0);
  });

  // the 3D render it was drawn from, hidden on top of the map until the space bar is held
  let renderImage = null;
  viewer.addOnceHandler("open", () => {
    fitZoomLimits();
    showWholeMap(true);
    viewer.addTiledImage({
      tileSource: { type: "image", url: "render.webp", buildPyramid: true },
      x: 0, y: 0, width: 1, opacity: 0,
      success: (e) => { renderImage = e.item; },
    });
    const hash = location.hash.slice(1);
    if (FRAMES.some((f) => f.id === hash)) setTimeout(() => goTo(hash, true), 300);
  });

  const chips = document.getElementById("chips");
  for (const f of FRAMES) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = f.label; b.dataset.id = f.id;
    b.addEventListener("click", () => { moved = true; goTo(f.id); });
    chips.append(b);
  }

  function goTo(id, immediate = false) {
    const f = FRAMES.find((g) => g.id === id);
    const pad = FRAME * 0.15;
    viewer.viewport.fitBounds(new OpenSeadragon.Rect(vp(f.x - pad), vp(f.y - pad), vp(FRAME + 2 * pad), vp(FRAME + 2 * pad)), immediate);
    for (const c of chips.children) c.setAttribute("aria-current", String(c.dataset.id === id));
  }

  // hold the space bar to see the 3D render the pixel art was drawn from
  function showArt(on) {
    renderImage?.setOpacity(on ? 0 : 1);
  }
  window.addEventListener("keydown", (e) => { if (e.key === " " && !e.repeat && e.target === document.body) { e.preventDefault(); showArt(false); } });
  window.addEventListener("keyup", (e) => { if (e.key === " " && e.target === document.body) showArt(true); });

  document.getElementById("zoom-in").addEventListener("click", () => { moved = true; viewer.viewport.zoomBy(1.6); });
  document.getElementById("zoom-out").addEventListener("click", () => { moved = true; viewer.viewport.zoomBy(1 / 1.6); });
  document.getElementById("home").addEventListener("click", () => {
    moved = false;
    showWholeMap(false);
    for (const c of chips.children) c.setAttribute("aria-current", "false");
  });
</script>
